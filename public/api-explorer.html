<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bitcoin Writer API Explorer</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css"
  />
  <style>
    body {
      margin: 0;
      background: #0f172a;
      color: #fff;
      font-family: Arial, sans-serif;
    }
    .top {
      padding: 14px 18px;
      border-bottom: 1px solid #1e293b;
      background: #111827;
    }
    .top a {
      color: #22d3ee;
      text-decoration: none;
      margin-right: 18px;
      font-size: 14px;
    }
    #swagger-ui {
      max-width: 1200px;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <div class="top">
    <a href="/openapi.yaml" target="_blank" rel="noopener noreferrer">Download OpenAPI YAML</a>
    <a href="/api">Back to API Page</a>
  </div>
  <div id="swagger-ui"></div>

  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <script>
    window.ui = SwaggerUIBundle({
      url: "/openapi.yaml",
      dom_id: "#swagger-ui",
      deepLinking: true,
      presets: [SwaggerUIBundle.presets.apis],
      layout: "BaseLayout",
      tryItOutEnabled: true
    });
  </script>
</body>
</html>
